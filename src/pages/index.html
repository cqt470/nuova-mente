<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Escape Rooms</title>
    <link rel="stylesheet" href="../styles/style.css">
    <script type="module" src="../js/index.js"></script>
</head>
<body>
    <main>
        <section class="content">
            <header>
                <h1>ESCAPE ROOMS</h1>
            </header>
            <article class="cards grid col3">
                <div class="card" redirect="room.html">
                    <div class="image">
                        <img src="../media/room-ww2.png" alt="WW2" draggable="false">
                    </div>
                    <div class="details">
                        <p class="title">Seconda Guerra Mondiale</p>
                    </div>
                </div>
                <div class="card">
                    <div class="image">
                        <img src="../media/room-law.png" alt="law" draggable="false">
                    </div>
                    <div class="details">
                        <p class="title">Giurispriduenza</p>
                    </div>
                </div>
                <div class="card">
                    <div class="image">
                        <img src="../media/room-eco.png" alt="eco" draggable="false">
                    </div>
                    <div class="details">
                        <p class="title">Un futuro più eco</p>
                    </div>
                </div>
                <div class="card">
                    <div class="image">
                        <img src="../media/room-arch.png" alt="arch" draggable="false">
                    </div>
                    <div class="details">
                        <p class="title">Arch Linux - Un mondo nuovo</p>
                    </div>
                </div>
                <div class="card">
                    <div class="image">
                        <img src="../media/room-java.png" alt="WW2" draggable="false">
                    </div>
                    <div class="details">
                        <p class="title">OOP - Java (the best)</p>
                    </div>
                </div>
            </article>
        </section>
        <section class="sidebar">
            <article class="content">
                <div class="pfp">
                    <p>GC</p>
                </div>
                <div class="actions">
                    <p class="title">Actions</p>
                    <div class="ctas">
                        <p redirect="index.html">Escape Rooms</p>
                        <p redirect="leaderboards.html">Leaderboards</p>
                    </div>
                </div>
            </article>
            <footer>
                <p class="copy">Made with ♡ by Nuova-Mente</p>
            </footer>
        </section>
    </main>
</body>
</html>
